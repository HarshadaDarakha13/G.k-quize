<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School GK Quiz</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .quiz-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
            padding: 25px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #333;
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        .progress-box {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #11998e, #38ef7d);
            transition: width 0.3s ease;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .opt-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
            color: #495057;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .opt-btn:hover:not(:disabled) {
            background-color: #e0e7ff;
            border-color: #6366f1;
            color: #4338ca;
            transform: translateY(-2px);
        }
        .opt-btn.correct {
            background-color: #d1e7dd !important;
            border-color: #0f5132 !important;
            color: #0f5132 !important;
            font-weight: bold;
        }
        .opt-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #842029 !important;
            color: #842029 !important;
            font-weight: bold;
        }
        .explanation {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background-color: #eef2ff;
            border-left: 4px solid #6366f1;
            color: #3730a3;
            font-size: 14px;
            display: none;
        }
        .footer-controls {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .next-btn, .restart-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            display: none;
        }
        .next-btn:hover, .restart-btn:hover { opacity: 0.9; }
        .score-board {
            font-size: 14px;
            font-weight: 600;
            color: #6c757d;
        }
        .result-container {
            text-align: center;
            padding: 20px 0;
            display: none;
        }
        .result-score {
            font-size: 32px;
            font-weight: bold;
            color: #4f46e5;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h1>🧠 General Knowledge Quiz</h1>
        <div class="progress-box"><div class="progress-bar" id="progress"></div></div>
    </div>

    <div id="quiz-body">
        <div class="question-box" id="question">Loading Question...</div>
        <div class="options-list" id="options"></div>
        <div class="explanation" id="explanation"></div>

        <div class="footer-controls">
            <div class="score-board">
                Correct: <span id="correct-count" style="color:#10b981;">0</span> | 
                Wrong: <span id="wrong-count" style="color:#ef4444;">0</span>
            </div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
        </div>
    </div>

    <div class="result-container" id="result">
        <h2 style="color:#333;">🎉 Quiz Completed!</h2>
        <p>Your Final Score:</p>
        <div class="result-score" id="final-score">0 / 15</div>
        <p id="result-message" style="color:#6b7280; margin-bottom:20px; font-weight: 600;"></p>
        <button class="restart-btn" id="restart-btn" style="display:inline-block;" onclick="restartQuiz()">🔄 Try Again</button>
    </div>
</div>

<script>
    const quizData = [
        { q: "1. What is the capital of India?", opts: ["Mumbai", "Delhi", "Kolkata", "Chennai"], c: 1, info: "Correct Answer: Delhi" },
        { q: "2. Which is the national bird of India?", opts: ["Parrot", "Pigeon", "Peacock", "Eagle"], c: 2, info: "Correct Answer: Peacock" },
        { q: "3. How many days are there in a normal year?", opts: ["300", "365", "350", "400"], c: 1, info: "Correct Answer: 365 Days" },
        { q: "4. Which is the national flower of India?", opts: ["Rose", "Lotus", "Marigold", "Sunflower"], c: 1, info: "Correct Answer: Lotus" },
        { q: "5. Which is the largest ocean in the world?", opts: ["Atlantic Ocean", "Indian Ocean", "Pacific Ocean", "Arctic Ocean"], c: 2, info: "Correct Answer: Pacific Ocean" },
        { q: "6. Who was the first Prime Minister of India?", opts: ["Mahatma Gandhi", "Pt. Jawaharlal Nehru", "Sardar Patel", "Dr. B.R. Ambedkar"], c: 1, info: "Correct Answer: Pt. Jawaharlal Nehru" },
        { q: "7. Which planet is known as the 'Red Planet'?", opts: ["Venus", "Mars", "Jupiter", "Saturn"], c: 1, info: "Correct Answer: Mars" },
        { q: "8. How many bones are there in an adult human body?", opts: ["206", "300", "208", "190"], c: 0, info: "Correct Answer: 206" },
        { q: "9. Which is the national sport of India?", opts: ["Cricket", "Football", "Hockey", "Kabaddi"], c: 2, info: "Correct Answer: Hockey" },
        { q: "10. Which component is known as the Brain of the Computer?", opts: ["RAM", "Hard Disk", "CPU", "Monitor"], c: 2, info: "Correct Answer: CPU" },
        { q: "11. Which is the longest river in India?", opts: ["Yamuna", "Ganga", "Godavari", "Narmada"], c: 1, info: "Correct Answer: Ganga" },
        { q: "12. Which is the largest planet in our Solar System?", opts: ["Jupiter", "Saturn", "Earth", "Mars"], c: 0, info: "Correct Answer: Jupiter" },
        { q: "13. In which year did India get Independence?", opts: ["1950", "1947", "1869", "1942"], c: 1, info: "Correct Answer: 15th August 1947" },
        { q: "14. Where is the Taj Mahal located in India?", opts: ["Delhi", "Jaipur", "Agra", "Lucknow"], c: 2, info: "Correct Answer: Agra" },
        { q: "15. Which country invented Paper?", opts: ["India", "China", "Japan", "America"], c: 1, info: "Correct Answer: China" }
    ];

    let index = 0;
    let right = 0;
    let wrong = 0;

    function loadQuestion() {
        resetState();
        let curr = quizData[index];
        document.getElementById("question").innerText = curr.q;
        document.getElementById("progress").style.width = ((index) / quizData.length * 100) + "%";

        const optContainer = document.getElementById("options");
        curr.opts.forEach((o, i) => {
            const btn = document.createElement("button");
            btn.classList.add("opt-btn");
            btn.innerText = o;
            btn.onclick = () => select(i, btn);
            optContainer.appendChild(btn);
        });
    }

    function resetState() {
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("explanation").style.display = "none";
        document.getElementById("options").innerHTML = "";
    }

    function select(i, btn) {
        let curr = quizData[index];
        let allBtns = document.getElementById("options").getElementsByClassName("opt-btn");
        for (let b of allBtns) {
            b.disabled = true;
        }

        if (i === curr.c) {
            btn.classList.add("correct");
            right++;
            document.getElementById("correct-count").innerText = right;
        } else {
            btn.classList.add("wrong");
            allBtns[curr.c].classList.add("correct");
            wrong++;
            document.getElementById("wrong-count").innerText = wrong;
        }

        document.getElementById("explanation").innerText = curr.info;
        document.getElementById("explanation").style.display = "block";
        
        if (index === quizData.length - 1) {
            document.getElementById("next-btn").innerText = "Finish Quiz 🏁";
        } else {
            document.getElementById("next-btn").innerText = "Next Question ➔";
        }
        document.getElementById("next-btn").style.display = "inline-block";
    }

    function nextQuestion() {
        index++;
        if (index < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-body").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("progress").style.width = "100%";
        document.getElementById("final-score").innerText = right + " / " + quizData.length;
        
        let msg = "";
        if (right >= 12) {
            msg = "Well Done! Excellent Performance! 🎉";
        } else if (right >= 8) {
            msg = "Good Job! Great Effort! 👍";
        } else {
            msg = "Keep Trying! Better Luck Next Time! 💪";
        }
        document.getElementById("result-message").innerText = msg;
    }

    function restartQuiz() {
        index = 0;
        right = 0;
        wrong = 0;
        document.getElementById("correct-count").innerText = "0";
        document.getElementById("wrong-count").innerText = "0";
        document.getElementById("quiz-body").style.display = "block";
        document.getElementById("result").style.display = "none";
        document.getElementById("next-btn").innerText = "Next Question ➔";
        loadQuestion();
    }

    loadQuestion();
</script>
</body>
</html>
