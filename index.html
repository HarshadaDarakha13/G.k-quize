<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega School GK Quiz</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .quiz-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
            padding: 25px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #333;
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        .progress-box {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #11998e, #38ef7d);
            transition: width 0.3s ease;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .opt-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
            color: #495057;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .opt-btn:hover:not(:disabled) {
            background-color: #e0e7ff;
            border-color: #6366f1;
            color: #4338ca;
            transform: translateY(-2px);
        }
        .opt-btn.correct {
            background-color: #d1e7dd !important;
            border-color: #0f5132 !important;
            color: #0f5132 !important;
            font-weight: bold;
        }
        .opt-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #842029 !important;
            color: #842029 !important;
            font-weight: bold;
        }
        .explanation {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background-color: #eef2ff;
            border-left: 4px solid #6366f1;
            color: #3730a3;
            font-size: 14px;
            display: none;
        }
        .footer-controls {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .next-btn, .restart-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            display: none;
        }
        .next-btn:hover, .restart-btn:hover { opacity: 0.9; }
        .score-board {
            font-size: 14px;
            font-weight: 600;
            color: #6c757d;
        }
        .result-container {
            text-align: center;
            padding: 20px 0;
            display: none;
        }
        .result-score {
            font-size: 32px;
            font-weight: bold;
            color: #4f46e5;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h1>🧠 School GK Quiz</h1>
        <div class="progress-box"><div class="progress-bar" id="progress"></div></div>
    </div>

    <div id="quiz-body">
        <div class="question-box" id="question">Question Text</div>
        <div class="options-list" id="options"></div>
        <div class="explanation" id="explanation"></div>

        <div class="footer-controls">
            <div class="score-board">
                Right: <span id="correct-count" style="color:#10b981;">0</span> | 
                Wrong: <span id="wrong-count" style="color:#ef4444;">0</span>
            </div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question➔</button>
        </div>
    </div>

    <div class="result-container" id="result">
        <h2 style="color:#333;">🎉 Finish Quiz !</h2>
        <p>Final Score:</p>
        <div class="result-score" id="final-score">0 / 15</div>
        <p id="result-message" style="color:#6b7280; margin-bottom:20px;"></p>
        <button class="restart-btn" id="restart-btn" style="display:inline-block;" onclick="restartQuiz()">🔄 Try Agian</button>
    </div>
</div>

<script>
    const quizData = [
        { q: "1. Bharat ki rajdhani (Capital) kya hai?", opts: ["Mumbai", "Delhi", "Kolkata", "Chennai"], c: 1, info: "Sahi Uttar: Delhi" },
        { q: "2. Bharat ka rashtriya pakshi kaun sa hai?", opts: ["Tota", "Kabutar", "Mor", "Baaz"], c: 2, info: "Sahi Uttar: Mor" },
        { q: "3. Ek saal me kitne din hote hain?", opts: ["300", "365", "350", "400"], c: 1, info: "Sahi Uttar: 365 din" },
        { q: "4. Bharat ka rashtriya phool kaun sa hai?", opts: ["Gulaab", "Kamal", "Genda", "Surajmukhi"], c: 1, info: "Sahi Uttar: Kamal" },
        { q: "5. Vishwa ka sabse bada mahasagar (Ocean) kaun sa hai?", opts: ["Atlantic", "Indian Ocean", "Pacific Ocean", "Arctic"], c: 2, info: "Sahi Uttar: Pacific Ocean (Prashant Mahasagar)" },
        { q: "6. Bharat ke pehle Pradhan Mantri kaun the?", opts: ["Mahatma Gandhi", "Pt. Jawaharlal Nehru", "Sardar Patel", "Dr. BR Ambedkar"], c: 1, info: "Sahi Uttar: Pt. Jawaharlal Nehru" },
        { q: "7. Kis grah (Planet) ko 'Red Planet' kaha jata hai?", opts: ["Shukra (Venus)", "Mangal (Mars)", "Bhaspati (Jupiter)", "Shani (Saturn)"], c: 1, info: "Sahi Uttar: Mangal (Mars)" },
        { q: "8. Human body me kitni bones (haddiyan) hoti hain?", opts: ["206", "300", "208", "190"], c: 0, info: "Sahi Uttar: 206" },
        { q: "9. Bharat ka rashtriya khel kaun sa hai?", opts: ["Cricket", "Football", "Hockey", "Kabaddi"], c: 2, info: "Sahi Uttar: Hockey" },
        { q: "10. Computer ka dimaag (Brain) kise kaha jata hai?", opts: ["RAM", "Hard Disk", "CPU", "Monitor"], c: 2, info: "Sahi Uttar: CPU" },
        { q: "11. Bharat ki sabse lambi nadi kaun si hai?", opts: ["Yamuna", "Ganga", "Godavari", "Narmada"], c: 1, info: "Sahi Uttar: Ganga" },
        { q: "12. Saur mandal (Solar System) ka sabse bada grah kaun sa hai?", opts: ["Bhaspati (Jupiter)", "Shani", "Prithvi", "Mangal"], c: 0, info: "Sahi Uttar: Bhaspati (Jupiter)" },
        { q: "13. Bharat kab azad hua tha?", opts: ["26 Jan 1950", "15 Aug 1947", "2 Oct 1869", "14 Aug 1947"], c: 1, info: "Sahi Uttar: 15 August 1947" },
        { q: "14. Taj Mahal Bharat ke kis shehar me hai?", opts: ["Delhi", "Jaipur", "Agra", "Lucknow"], c: 2, info: "Sahi Uttar: Agra" },
        { q: "15. Kagaz (Paper) ka aavishkar kis desh me hua tha?", opts: ["Bharat", "China", "Japan", "America"], c: 1, info: "Sahi Uttar: China" }
    ];

    let index = 0, right = 0, wrong = 0;

    const qEl = document.getElementById("question");
    const optEl = document.getElementById("options");
    const expEl = document.getElementById("explanation");
    const nextBtn = document.getElementById("next-btn");
    const progressEl = document.getElementById("progress");

    function loadQuestion() {
        resetState();
        let curr = quizData[index];
        qEl.innerText = curr.q;
        progressEl.style.width = ((index) / quizData.length * 100) + "%";

        curr.opts.forEach((o, i) => {
            const btn = document.createElement("button");
            btn.classList.add("opt-btn");
            btn.innerText = o;
            btn.onclick = () => select(i, btn);
            optEl.appendChild(btn);
        });
    }

    function resetState() {
        nextBtn.style.display = "none";
        expEl.style.display = "none";
        optEl.innerHTML = "";
    }

    function select(i, btn) {
        let curr = quizData[index];
        let allBtns = optEl.getElementsByClassName("opt-btn");
        for (let b of allBtns) b.disabled = true;

        if (i === curr.c) {
            btn.classList.add("correct");
            right++;
            document.getElementById("correct-count").innerText = right;
        } else {
            btn.classList.add("wrong");
            allBtns[curr.c].classList.add("correct");
            wrong++;
            document.getElementById("wrong-count").innerText = wrong;
        }

        expEl.innerText = curr.info;
        expEl.style.display = "block";
        nextBtn.style.display = "inline-block";
    }

    function nextQuestion() {
        index++;
        if (index < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-body").style.display = "none";
        document.getElementById("result").style.display = "block";
        progressEl.style.width = "100%";
        document.getElementById("final-score").innerText = right + " / " + quizData.length;
        let msg = right >= 12 ? "Shandar Performance! 🎉" : right >= 8 ? "Well Done! 👍" Keep Trying: "! 💪";
        document.getElementById("result-message").innerText = msg;
    }

    function restartQuiz() {
        index = 0; right = 0; wrong = 0;
        document.getElementById("correct-count").innerText = "0";
        document.getElementById("wrong-count").innerText = "0";
        document.getElementById("quiz-body").style.display = "block";
        document.getElementById("result").style.display = "none";
        loadQuestion();
    }

    loadQuestion();
</script>
</body>
</html>
